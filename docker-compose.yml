version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: estoque-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: estoque_user
      POSTGRES_PASSWORD: estoque_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
